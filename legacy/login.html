<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentFit OS — Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Layout centrado para la página de login */
        body {
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .login-form .input-group {
            min-width: 100%;
        }

        .login-form input {
            width: 100%;
            padding: 14px;
            font-size: 15px;
        }

        .login-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 15px;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-register:hover {
            background-color: var(--neon-green-dim);
        }

        .login-error {
            color: #ff4444;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            margin-top: 4px;
        }

        .login-success {
            color: var(--neon-green);
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            margin-top: 4px;
        }

        .login-divider {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            position: relative;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background-color: var(--border-color);
        }

        .login-divider::before { left: 0; }
        .login-divider::after { right: 0; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>StudentFit <span class="neon-text">OS</span></h1>
                <p>Inicia sesión para acceder a tu entrenamiento</p>
            </div>

            <form id="login-form" class="login-form" autocomplete="on">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="tu@email.com" autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••" minlength="6" autocomplete="current-password">
                </div>

                <div class="login-actions">
                    <button type="submit" id="btn-login" class="btn-neon btn-login">Iniciar Sesión</button>
                    <div class="login-divider">o</div>
                    <button type="button" id="btn-register" class="btn-register">Crear Cuenta Nueva</button>
                </div>

                <p id="login-msg" class="login-error"></p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>
</html>
